[project]
name = "jarvis-voice-local"
version = "0.3.0"
description = "Local Turkish desktop companion with voice, chat and Ollama"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.165.0",
  "uvicorn==0.54.0",
  "websockets==17.4",
  "httpx==0.28.1",
  "numpy==2.3.5",
  "faster-whisper==1.2.1",
  "ctranslate2==4.9.1",
  "onnxruntime==1.32.0",
  "av==16.1.0",
  "huggingface-hub==0.36.0",
  "ema-lightning==1.1.2",
  "normalizer-tr==0.8.1",
  "torch==2.10.0+cpu",
  "tzdata==2026.6",
  "tiktoken==0.12.0",
]

[project.optional-dependencies]
desktop = [
  "pywebview==6.2.1 ; sys_platform == 'win32'",
  "pythonnet==3.2.1 ; sys_platform == 'win32'",
]

[tool.uv]
package = false
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'", "sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
